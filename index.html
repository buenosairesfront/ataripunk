<title>U-MA Atari Punk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Atari Punk Console con dos NE555: cambiá cada pieza, mirá el osciloscopio y escuchá la salida en vivo. U-MA サウンド">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&text=%E3%82%B5%E3%82%A6%E3%83%B3%E3%83%89&display=swap" rel="stylesheet">
<style>
/* Layout: hoja técnica U-MA — osciloscopio arriba, fichas numeradas: circuito editable → tocar → escalera → placa → materiales */
:root{
  --bg:#C8C9C5; --paper:#F0EFEA; --paperFg:#141414; --paperLine:rgba(20,20,20,.22); --paperMute:#5E5E5A;
  --ink:#121314; --mag:#D12F7D; --cya:#2A9EBF; --yel:#E1C43B; --grey:#8D8E8A;
  --disp:"Barlow Condensed","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#08090A; --paper:#1C1D1F; --paperFg:#EAE8E2; --paperLine:rgba(255,255,255,.16); --paperMute:#9B9A95; --ink:#000; --grey:#6A6B68; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#08090A; --paper:#1C1D1F; --paperFg:#EAE8E2; --paperLine:rgba(255,255,255,.16); --paperMute:#9B9A95; --ink:#000; --grey:#6A6B68; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--paperFg); font:14px/1.45 var(--mono); -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:0}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer; touch-action:manipulation}
:focus-visible{outline:2px solid var(--cya); outline-offset:2px}
.app{max-width:1060px; margin:0 auto; padding:0 0 60px}

.p-paper{--pb:var(--paper); --pf:var(--paperFg); --pl:var(--paperLine); --pm:var(--paperMute); --pa:var(--mag); --pat:#fff}
.p-ink{--pb:var(--ink); --pf:#ECEBE6; --pl:rgba(255,255,255,.2); --pm:#9C9B97; --pa:var(--cya); --pat:#0B0B0B}
.p-mag{--pb:var(--mag); --pf:#101010; --pl:rgba(0,0,0,.32); --pm:rgba(0,0,0,.68); --pa:#101010; --pat:var(--mag)}
.panel{background:var(--pb); color:var(--pf); border:1.5px solid var(--pf); outline:1.5px solid var(--pb); position:relative}
.panel::after{content:""; position:absolute; inset:5px; border:1px solid var(--pl); pointer-events:none}
.panel>.in{padding:14px 16px 18px; position:relative; z-index:1}

.top{padding:10px 0 0}
.bar{display:flex; align-items:center; gap:10px}
.logo{height:42px; width:auto; flex:none; display:block}
.title{flex:1; min-width:0}
.title b{display:block; font:800 clamp(20px,5.4vw,30px)/.95 var(--disp); text-transform:uppercase; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.title small{display:flex; gap:10px; font:500 10.5px/1.3 var(--mono); color:var(--paperMute); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; white-space:nowrap; overflow:hidden}
.play{height:40px; padding:0 14px; border:1.5px solid var(--paperFg); background:var(--mag); color:#fff; font:700 13px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; display:inline-flex; align-items:center; gap:8px; flex:none}
.play i{width:10px; height:10px; background:#fff; display:block; clip-path:polygon(0 0,100% 50%,0 100%)}
.play[aria-pressed="true"]{background:var(--paperFg); color:var(--paper)}
.play[aria-pressed="true"] i{clip-path:none; background:var(--mag); animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

.scopecard{margin-top:10px}
.scopecard>.in{padding:10px 12px}
.meta{display:flex; justify-content:space-between; gap:8px; font:500 10px/1.2 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--pm); flex-wrap:wrap}
#scope{display:block; width:100%; height:250px; margin:6px 0}
.readout{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--pl)}
.readout div{padding:4px 6px 0; border-left:1px solid var(--pl); min-width:0}
.readout div:first-child{border-left:0; padding-left:0}
.readout span{display:block; font:500 9.5px/1.2 var(--mono); color:var(--pm); letter-spacing:.08em; text-transform:uppercase}
.readout b{display:block; font:700 21px/1.1 var(--disp); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums}
.readout b em{font-style:normal; color:var(--mag)}
@media (max-width:640px){ .readout{grid-template-columns:1fr 1fr} .readout div:nth-child(3){border-left:0; padding-left:0} #scope{height:220px} }

section{margin-top:18px}
.sh{border-bottom:1.5px solid var(--pf); margin-bottom:12px; padding-bottom:8px}
.sh .meta{margin-bottom:6px}
.shm{display:flex; align-items:flex-end; gap:8px 12px; flex-wrap:wrap}
.num{font:800 52px/.82 var(--disp); letter-spacing:-.02em; flex:none}
.shm h2{margin:0; font:700 26px/1 var(--disp); text-transform:uppercase; letter-spacing:.02em; text-wrap:balance}
.shm .aside{display:flex; gap:6px; align-items:center; flex:none; margin-left:auto}
.sq{display:flex; gap:3px; margin-bottom:4px}
.sq i{width:9px; height:9px; border:1px solid var(--pf)}
.sq i.m{background:var(--mag)} .sq i.c{background:var(--cya)} .sq i.y{background:var(--yel)}
.lbl{font:500 10.5px/1.2 var(--mono); color:var(--pm); text-transform:uppercase; letter-spacing:.08em; margin:14px 0 6px}
.note{color:var(--pm); font-size:12px; margin:10px 0 0; max-width:72ch}
.btn{border:1.5px solid var(--pf); background:var(--pb); color:var(--pf); padding:7px 11px; font:600 12px/1 var(--mono); text-transform:uppercase; letter-spacing:.04em; min-height:34px; white-space:nowrap}
.btn.acc{background:var(--pa); color:var(--pat); border-color:var(--pa)}
.btn[aria-pressed="true"]{background:var(--pf); color:var(--pb)}
.row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.hz{height:12px; margin-top:14px; background:repeating-linear-gradient(-45deg,var(--pf) 0 6px,transparent 6px 12px); border:1.5px solid var(--pf)}

/* 01 circuito */
.schwrap{border:1.5px solid var(--pf); background:var(--paper); overflow-x:auto}
#sch{display:block; width:100%; min-width:660px; user-select:none}
#sch .w{fill:none; stroke:var(--pf); stroke-width:2; stroke-linejoin:round}
#sch .dot{fill:var(--pf)}
#sch .part{cursor:pointer}
#sch .hl{fill:transparent; stroke:none}
#sch .part:hover .hl{fill:var(--pl)}
#sch .part.sel .hl{fill:rgba(209,47,125,.16); stroke:var(--mag); stroke-width:1.5; stroke-dasharray:5 3}
#sch .body{fill:var(--paper); stroke:var(--pf); stroke-width:2}
#sch .part.sel .body{fill:var(--mag)}
#sch .pl{fill:none; stroke:var(--pf); stroke-width:3}
#sch text{fill:var(--pf)}
#sch .ref{font:700 16px var(--disp)}
#sch .val{font:600 11px var(--mono); fill:var(--pm)}
#sch .pin{font:600 9px var(--mono); fill:var(--pm)}
#sch .pn{font:700 9px var(--mono)}
#sch .cb{fill:url(#hatch); stroke:var(--pf); stroke-width:2}
#sch .chipt{font:800 22px var(--disp)}
#sch .chips{font:600 10px var(--mono); fill:var(--pm); letter-spacing:.06em}
#sch .hatchl{stroke:var(--pl); stroke-width:1.2}
#sch .arrow{fill:var(--pf)}
.flow{fill:none; stroke-width:3.5; stroke-dasharray:3 14; opacity:0; transition:opacity .2s}
.flow.c{stroke:var(--cya)} .flow.m{stroke:var(--mag)} .flow.y{stroke:var(--yel)}
body.on .flow{opacity:1; animation:flow .45s linear infinite}
@keyframes flow{to{stroke-dashoffset:-17}}
.partbar{display:flex; flex-wrap:wrap; gap:4px; margin-top:12px}
.pbt{border:1.5px solid var(--pf); background:transparent; color:var(--pf); padding:6px 8px; font:700 16px/1 var(--disp); min-height:34px; display:inline-flex; gap:6px; align-items:baseline}
.pbt small{font:500 10px/1 var(--mono); color:var(--pm)}
.pbt[aria-pressed="true"]{background:var(--pf); color:var(--pb)}
.pbt[aria-pressed="true"] small{color:inherit; opacity:.75}
.pbt.lock{border-style:dashed}
.ed{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr); gap:18px; margin-top:10px; border:1.5px solid var(--pf); padding:14px}
@media (max-width:760px){ .ed{grid-template-columns:1fr} }
.edref{font:800 66px/.85 var(--disp); letter-spacing:-.01em}
.edref em{font-style:normal; color:var(--mag)}
.edname{font:700 21px/1.05 var(--disp); text-transform:uppercase; margin-top:6px}
.edmini{margin-top:10px; border:1.5px solid var(--pf); background:#121314; height:96px}
.edmini svg{display:block; width:100%; height:100%}
.role{font-size:12.5px; margin:10px 0 0}
.bigval{font:800 clamp(44px,8vw,68px)/.9 var(--disp); font-variant-numeric:tabular-nums; white-space:nowrap}
.code{font:600 11px/1.3 var(--mono); color:var(--pm); text-transform:uppercase; letter-spacing:.06em; margin-top:6px}
.vrow{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:10px}
.vrow input[type=text]{width:120px; border:1.5px solid var(--pf); background:transparent; padding:7px 9px; font:600 13px var(--mono); min-height:34px; color:var(--pf)}
input[type=range]{width:100%; accent-color:var(--mag); margin:10px 0 0}
.eff{margin-top:10px; font-size:12.5px; border-left:3px solid var(--mag); padding-left:10px}
.live{display:flex; gap:8px 18px; flex-wrap:wrap; margin-top:12px; border-top:1px solid var(--pl); padding-top:8px}
.live span{display:block; font:500 9.5px/1.2 var(--mono); color:var(--pm); letter-spacing:.08em; text-transform:uppercase}
.live b{font:700 22px/1.1 var(--disp); font-variant-numeric:tabular-nums}
.lockbox{border:1.5px dashed var(--pf); padding:10px 12px; margin-top:10px; background:repeating-linear-gradient(-45deg,transparent 0 7px,var(--pl) 7px 8px)}
.lockbox b{font:800 26px/1 var(--disp)}
.pinlist{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px; margin-top:10px; font-size:12px}
.pinlist div{border:1px solid var(--pl); padding:4px 6px}
.pinlist b{font:700 15px var(--disp); margin-right:6px}

/* 02 tocar */
.playgrid{display:grid; grid-template-columns:minmax(0,1fr) 170px; gap:14px; align-items:start}
@media (max-width:720px){ .playgrid{grid-template-columns:1fr} }
.padbox{position:relative; border:1.5px solid var(--pf); background:#0B0B0C}
#pad{display:block; width:100%; aspect-ratio:16/10; touch-action:none; cursor:crosshair}
.padhud{position:absolute; left:10px; top:8px; pointer-events:none; color:#F0EFEA; text-shadow:0 1px 0 #000}
.padhud b{display:block; font:800 clamp(30px,6vw,52px)/.9 var(--disp)}
.padhud span{font:600 10.5px var(--mono); letter-spacing:.06em; text-transform:uppercase; opacity:.85}
.padax{display:flex; justify-content:space-between; font:600 10px var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--pm); margin-top:6px; gap:8px; flex-wrap:wrap}
.knobs{display:grid; grid-template-columns:1fr; gap:10px}
@media (max-width:720px){ .knobs{grid-template-columns:repeat(3,1fr)} }
.knob{display:flex; flex-direction:column; align-items:center; text-align:center}
.knob svg{width:100%; max-width:120px; touch-action:none; cursor:ns-resize; display:block}
.knob b{font:800 20px/1 var(--disp); text-transform:uppercase}
.knob span{font:600 10.5px var(--mono); color:var(--pm); letter-spacing:.04em}

/* 03 escalera */
#stair{display:block; width:100%; height:300px; touch-action:none; cursor:ew-resize; border:1.5px solid var(--pf); background:var(--paper)}

/* 04 placa */
.boardwrap{overflow-x:auto; border:1.5px solid var(--pf)}
#board{display:block; width:100%; min-width:660px; user-select:none}
#board .bp{cursor:pointer}
#board .bhl{fill:none; stroke:none}
#board .bp:hover .bhl{stroke:rgba(255,255,255,.35); stroke-width:1.5; stroke-dasharray:4 3}
#board .bp.sel .bhl{stroke:var(--mag); stroke-width:2.5; stroke-dasharray:6 3; fill:rgba(209,47,125,.12)}
#board text{font-family:var(--mono)}

/* 05 materiales */
.tblw{overflow-x:auto; border:1.5px solid var(--pf)}
table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:520px}
th{font:600 10px var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--pm); text-align:left; padding:7px 10px; border-bottom:1.5px solid var(--pf)}
td{padding:7px 10px; border-top:1px solid var(--pl); vertical-align:middle}
td.r{font:800 18px var(--disp)}
td.v{font:700 17px var(--disp); white-space:nowrap}
tr.lk td{color:var(--pm)}
tr.lk td.r{color:var(--pf)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--pl)}
.bands{display:inline-flex; gap:2px; vertical-align:middle; margin-right:6px}
.bands i{width:7px; height:16px; border:1px solid var(--pf)}
.foot{margin-top:24px; font:500 10.5px/1.5 var(--mono); color:var(--paperMute); text-transform:uppercase; letter-spacing:.06em; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
.toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--paperFg); color:var(--paper); padding:8px 14px; font:600 12px var(--mono); text-transform:uppercase; letter-spacing:.06em; z-index:20}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>

<div class="app">
  <header class="top"><div class="bar" id="bar"></div></header>
  <div class="panel p-ink scopecard"><div class="in">
    <div class="meta"><span>OSCILOSCOPIO · 4 CANALES</span><span>U-MA サウンド</span><span id="scinfo">—</span></div>
    <canvas id="scope" aria-label="Osciloscopio: tensión de C1, salida de IC1, tensión de C2 y señal en el parlante"></canvas>
    <div class="readout">
      <div><span>Reloj · IC1</span><b id="ro-fa">—</b></div>
      <div><span>Pulso · IC2</span><b id="ro-tm">—</b></div>
      <div><span>División</span><b id="ro-n">—</b></div>
      <div><span>Salida</span><b id="ro-fo">—</b></div>
    </div>
  </div></div>
  <main id="main"></main>
  <div class="foot"><span>Atari Punk Console · diseño original de Forrest M. Mims III (Stepped Tone Generator) · simulación aproximada, sin carga real del 555</span><span>U-MA サウンド</span></div>
</div>

<script>
/* ===================== utilidades ===================== */
const $=(q,r=document)=>r.querySelector(q);
function h(tag,a,...kids){const e=document.createElement(tag);if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const NS='http://www.w3.org/2000/svg';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const LOGO_INNER=`<defs><linearGradient id="lgL" x1="0" x2="1"><stop offset="0" stop-color="#7d7e7b"/><stop offset=".55" stop-color="#b9bab7"/><stop offset="1" stop-color="#9a9b98"/></linearGradient><linearGradient id="lgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9cac7"/><stop offset="1" stop-color="#8e8f8c"/></linearGradient></defs>
  <polygon points="36,6 14,28 14,206 36,184" fill="url(#lgL)" stroke="#161616" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="36,184 14,206 300,206 322,184" fill="url(#lgB)" stroke="#161616" stroke-width="3" stroke-linejoin="round"/>
  <rect x="36" y="6" width="286" height="178" rx="3" fill="#161616"/>
  <rect x="45" y="14" width="268" height="114" rx="2" fill="#EAEAE7"/>
  <text x="179" y="113" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="116" textLength="248" lengthAdjust="spacingAndGlyphs" fill="#161616">U-MA</text>
  <rect x="45" y="136" width="36" height="40" fill="#D12F7D" stroke="#161616" stroke-width="2"/>
  <rect x="85" y="136" width="36" height="40" fill="#2A9EBF" stroke="#161616" stroke-width="2"/>
  <rect x="125" y="136" width="36" height="40" fill="#E1C43B" stroke="#161616" stroke-width="2"/>
  <rect x="166" y="136" width="147" height="40" fill="#EAEAE7"/>
  <text x="239.5" y="165" text-anchor="middle" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-weight="900" font-size="27" letter-spacing="2" fill="#161616" stroke="#161616" stroke-width="1.2" paint-order="stroke">サウンド</text>`;
function logoSVG(){const w=document.createElementNS(NS,'svg');w.setAttribute('viewBox','0 0 330 212');w.setAttribute('class','logo');w.setAttribute('role','img');w.setAttribute('aria-label','U-MA サウンド');w.innerHTML=LOGO_INNER;return w;}
function secHead(num,title,meta){return h('div',{class:'sh'},h('div',{class:'meta'},h('span',null,meta),h('span',null,'U-MA サウンド')),
  h('div',{class:'shm'},h('div',{class:'num'},num),h('h2',null,title),h('div',{class:'aside'},h('div',{class:'sq'},h('i',{class:'m'}),h('i',{class:'c'}),h('i',{class:'y'})))));}
let toastT;function toast(t){let e=$('.toast');if(!e){e=h('div',{class:'toast',role:'status'});document.body.append(e);}e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,1600);}

/* ===================== valores ===================== */
const E12=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2], E6=[1,1.5,2.2,3.3,4.7,6.8], POT=[1,2,2.5,5];
function seriesList(m,min,max){const o=[];for(let d=-12;d<=7;d++)for(const x of m){const v=+(x*Math.pow(10,d)).toPrecision(3);if(v>=min*.999&&v<=max*1.001)o.push(v);}return o;}
function fmtV(v,u){
  if(u==='V')return (Math.round(v*10)/10).toString().replace('.',',')+' V';
  const pre=u==='F'?[[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']]:[[1e6,'M'],[1e3,'k'],[1,'']];
  for(const [m,p] of pre){if(v>=m*.9995||m===pre[pre.length-1][0]){const x=v/m;const s=x>=100?x.toFixed(0):x>=10?(+x.toFixed(1)).toString():(+x.toFixed(2)).toString();return s.replace('.',',')+' '+p+u;}}
}
function fmtT(s){if(s>=1)return (+s.toFixed(2)).toString().replace('.',',')+' s';if(s>=1e-3)return (+(s*1e3).toPrecision(3)).toString().replace('.',',')+' ms';return (+(s*1e6).toPrecision(3)).toString().replace('.',',')+' µs';}
function fmtF(f){if(f>=1e3)return (+(f/1e3).toPrecision(3)).toString().replace('.',',')+' kHz';return (+f.toPrecision(3)).toString().replace('.',',')+' Hz';}
const NOTAS=['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
function nota(f){if(!(f>8&&f<30000))return '—';const m=69+12*Math.log2(f/440),r=Math.round(m),c=Math.round((m-r)*100);return NOTAS[(r%12+12)%12]+(Math.floor(r/12)-1)+(c?(c>0?' +':' −')+Math.abs(c)+'¢':'');}
function parseVal(str){let s=String(str).trim().replace(',','.').replace(/µ/g,'u').replace(/ohms?|Ω|[FfVv]$/g,'').replace(/\s+/g,'');
  const m=s.match(/^(\d*\.?\d+)([pnumkKMR]?)(\d*)$/);if(!m)return NaN;
  const mult={p:1e-12,n:1e-9,u:1e-6,m:1e-3,k:1e3,K:1e3,M:1e6,R:1,'':1}[m[2]];
  return (m[3]?parseFloat(m[1]+'.'+m[3]):parseFloat(m[1]))*mult;}
/* bandas de resistencia */
const BC=['#141414','#7B4A22','#D0342C','#EE7D22','#F2D23A','#2E9D49','#2F6BD8','#8A4FC4','#8D8E8A','#F4F3EE'];
const BN=['negro','marrón','rojo','naranja','amarillo','verde','azul','violeta','gris','blanco'];
function bands(v){let e=Math.floor(Math.log10(v))-1,d=Math.round(v/Math.pow(10,e));if(d>=100){d=Math.round(d/10);e++;}
  const a=Math.floor(d/10),b=d%10;const mc=e===-1?'#C9A54A':e===-2?'#C0C0C0':BC[clamp(e,0,9)],mn=e===-1?'oro':e===-2?'plata':BN[clamp(e,0,9)];
  return {c:[BC[a],BC[b],mc,'#C9A54A'],n:[BN[a],BN[b],mn,'oro']};}
function capCode(v){const pf=v/1e-12;if(pf<100)return Math.round(pf)+'';let e=Math.floor(Math.log10(pf))-1,d=Math.round(pf/Math.pow(10,e));if(d>=100){d=Math.round(d/10);e++;}return ''+d+e;}
const isElec=v=>v>=1e-6;
function code(id){const p=PM[id],v=V[id];
  if(p.k==='r'||p.k==='pot'&&false){const b=bands(v);return 'bandas · '+b.n.join(' · ');}
  if(p.k==='pot')return 'cuerpo · '+(v>=1e6?(+(v/1e6).toPrecision(3))+'M':v>=1e3?(+(v/1e3).toPrecision(3))+'K':v)+(TAP[id]==='A'?' logarítmico (A)':' lineal (B)');
  if(p.k==='c')return isElec(v)?'electrolítico · '+fmtV(v,'F')+' · 25 V':'cerámico · código '+capCode(v);
  if(p.k==='v')return 'pila / fuente · '+fmtV(v,'V');
  if(p.k==='z')return 'parlante · '+v+' Ω · 0,5 W';
  return '';}

/* ===================== modelo ===================== */
const taper=(id,p)=>TAP[id]==='A'?(Math.pow(10,2*p)-1)/99:p;
function calc(v=V,p1=POS.VR1,p2=POS.VR2){
  const RA=v.R1,RB=Math.max(50,v.VR1*taper('VR1',p1));
  const Th=.693*(RA+RB)*v.C1,Tl=.693*RB*v.C1,Ta=Th+Tl;
  const Rm=v.R2+Math.max(50,v.VR2*taper('VR2',p2)),Tm=1.1*Rm*v.C2;
  const n=Math.floor(Tm/Ta)+1,To=n*Ta;
  const rco=(v.R3+v.SPK)*v.C3;
  return {RA,RB,Rm,Th,Tl,Ta,fa:1/Ta,Tm,n,To,fo:1/To,rco,hp:1/(2*Math.PI*rco),vh:Math.max(0,v.VCC-1.7),
    gain:(v.SPK/(v.R3+v.SPK))*Math.max(0,v.VCC-1.7)/((8/228)*7.3)};
}
/* núcleo de audio: eventos exactos de los dos 555 por muestra (se usa en el AudioWorklet y como respaldo) */
function makeCore(){return {p:{Th:1e-4,Tl:1e-4,Tm:1e-3,vh:7.3,rc:2.28e-3,g:0,on:0},ph:0,mono:0,str:false,xp:0,y:0,env:0,
  render(o,sr){const p=this.p,dt=1/sr,Th=Math.max(2e-7,p.Th),Tl=Math.max(2e-7,p.Tl),Ta=Th+Tl,Tm=Math.max(2e-7,p.Tm),a=p.rc/(p.rc+dt);
    if(this.ph>=Ta)this.ph=0;if(this.mono>Tm)this.mono=Tm;
    for(let i=0;i<o.length;i++){let r=dt,hi=0,it=0;
      while(r>1e-13&&it<400){it++;const low=this.ph>=Th,toA=low?Ta-this.ph:Th-this.ph,toM=this.mono>0?this.mono:1e9;
        const st=Math.max(0,Math.min(r,toA,toM));
        if(this.mono>0||(this.str&&low))hi+=st;
        this.ph+=st;r-=st;if(this.mono>0){this.mono-=st;if(this.mono<1e-13)this.mono=0;}
        if(!low&&this.ph>=Th-1e-13){this.ph=Th;if(this.mono<=0){this.mono=Tm;this.str=true;}}
        else if(low&&this.ph>=Ta-1e-13){this.ph=0;this.str=false;}}
      const x=(hi/dt)*p.vh;this.y=a*(this.y+x-this.xp);this.xp=x;
      this.env+=((p.on?1:0)-this.env)*.004;o[i]=Math.tanh(this.y*p.g)*this.env;}}};}
/* trazas para el osciloscopio */
function traces(win,N){
  const c=calc(),{Th,Tl,Ta,Tm}=c,Vc=V.VCC,vh=c.vh,r1=(c.RA+c.RB)*V.C1,r1d=c.RB*V.C1,rm=c.Rm*V.C2,rco=c.rco;
  let ph=0,mono=0,str=false,y=0,xp=0;const dtS=win/N,a=rco/(rco+dtS);
  function adv(d){let r=d,hi=0,it=0;while(r>1e-15&&it<6000){it++;const low=ph>=Th,toA=low?Ta-ph:Th-ph,toM=mono>0?mono:1e9,st=Math.max(0,Math.min(r,toA,toM));
    if(mono>0||(str&&low))hi+=st;ph+=st;r-=st;if(mono>0){mono-=st;if(mono<1e-15)mono=0;}
    if(!low&&ph>=Th-1e-15){ph=Th;if(mono<=0){mono=Tm;str=true;}}else if(low&&ph>=Ta-1e-15){ph=0;str=false;}}return hi/d;}
  const pre=Math.min(20000,Math.ceil(Math.max(4*rco,2*c.To)/dtS));
  for(let i=0;i<pre;i++){const x=adv(dtS)*vh;y=a*(y+x-xp);xp=x;}
  // alinear al inicio de un pulso de salida
  let guard=0;while(!(mono>0&&mono>Tm-dtS)&&guard++<40000){const x=adv(dtS/4)*vh;y=a*(y+x-xp);xp=x;}
  const T={c1:new Float32Array(N),o1:new Float32Array(N),c2:new Float32Array(N),sp:new Float32Array(N)};
  for(let i=0;i<N;i++){const lowB=ph>=Th;const f=adv(dtS),x=f*vh;y=a*(y+x-xp);xp=x;
    const low=ph>=Th;T.c1[i]=!low?Vc-(Vc-Vc/3)*Math.exp(-ph/r1):(2*Vc/3)*Math.exp(-(ph-Th)/r1d);
    T.o1[i]=(low&&lowB)?0:(!low&&!lowB)?vh:vh*.5;
    T.c2[i]=mono>0?Vc*(1-Math.exp(-(Tm-mono)/rm)):(str&&low?2*Vc/3:0);
    T.sp[i]=y;}
  T.o2=null;return T;
}

/* ===================== audio ===================== */
let actx=null,node=null,core=null;
async function startAudio(){
  if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();
    const src=makeCore.toString()+"\nclass P extends AudioWorkletProcessor{constructor(){super();this.c=makeCore();this.port.onmessage=e=>Object.assign(this.c.p,e.data);}process(i,outs){const o=outs[0];this.c.render(o[0],sampleRate);for(let k=1;k<o.length;k++)o[k].set(o[0]);return true;}}\nregisterProcessor('apc',P);";
    try{const url=URL.createObjectURL(new Blob([src],{type:'application/javascript'}));await actx.audioWorklet.addModule(url);node=new AudioWorkletNode(actx,'apc',{outputChannelCount:[2]});}
    catch(e){core=makeCore();node=actx.createScriptProcessor(1024,0,2);node.onaudioprocess=ev=>{const b=ev.outputBuffer,o=b.getChannelData(0);core.render(o,actx.sampleRate);b.getChannelData(1).set(o);};}
    node.connect(actx.destination);}
  if(actx.state==='suspended')await actx.resume();
}
function sendAudio(){if(!node)return;const c=calc();
  const m={Th:c.Th,Tl:c.Tl,Tm:c.Tm,vh:c.vh,rc:c.rco,g:VOL*.55*c.gain/7.3,on:playing&&(!gate||padDown)?1:0};
  if(node.port&&!core)node.port.postMessage(m);else if(core)Object.assign(core.p,m);}
async function togglePlay(){playing=!playing;if(playing){try{await startAudio();}catch(e){playing=false;toast('El navegador no dejó abrir el audio');}}
  document.body.classList.toggle('on',playing);$('#playbtn').setAttribute('aria-pressed',playing);$('#playbtn span').textContent=playing?'Sonando':'Sonido';sendAudio();startAnim();}

function boardChip(x0,y0,id,alone){let o=alone?`<svg viewBox="-20 -18 120 132">`:'';
  for(let k=0;k<4;k++){o+=`<rect x="${x0+7+20*k}" y="${y0-8}" width="6" height="9" fill="#B8B9B5"/><rect x="${x0+7+20*k}" y="${y0+95}" width="6" height="9" fill="#B8B9B5"/>`;}
  o+=`<rect x="${x0}" y="${y0}" width="80" height="96" rx="3" fill="#202124" stroke="#4A4B4E" stroke-width="1.5"/><path d="M${x0} ${y0+38}a10 10 0 0 1 0 20" fill="#0B0B0C"/><circle cx="${x0+12}" cy="${y0+84}" r="3" fill="#3A3B3E"/>`;
  o+=`<text x="${x0+44}" y="${y0+40}" text-anchor="middle" font-size="13" font-weight="700" fill="#ECEBE6">NE555</text><text x="${x0+44}" y="${y0+56}" text-anchor="middle" font-size="9" fill="#9C9B97">${id}</text>`;
  o+=`<g transform="translate(${x0+36} ${y0+64})"><rect x="0" y="6" width="16" height="12" fill="#D12F7D"/><path d="M3 6V3.5a5 5 0 0 1 10 0V6" fill="none" stroke="#D12F7D" stroke-width="2"/></g>`;
  if(alone){const lb=['1','2','3','4'],tb=['8','7','6','5'];for(let k=0;k<4;k++)o+=`<text x="${x0+10+20*k}" y="${y0+114}" text-anchor="middle" font-size="8" fill="#9C9B97">${lb[k]}</text><text x="${x0+10+20*k}" y="${y0-11}" text-anchor="middle" font-size="8" fill="#9C9B97">${tb[k]}</text>`;o+='</svg>';}
  return o;}

const BW=(d,c)=>`<path d="${d}" fill="none" stroke="${WC[c]}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
const BD=(x,y)=>`<circle cx="${x}" cy="${y}" r="4.5" fill="#ECEBE6" stroke="#101010" stroke-width="1.5"/>`;
const BL=(x,y,t,a='middle',c='#ECEBE6',fs=10)=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="${fs}" font-weight="700" fill="${c}">${t}</text>`;
const leg=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#B8B9B5" stroke-width="3"/>`;

  s+=BW('M24 40H876','vp')+BW('M24 330H876','gnd')+BL(882,44,'+','end','#D12F7D',13)+BL(882,325,'−','end','#8D8E8A',13);
  // batería

  s+=BW('M545 176H504','j');
  s+=`<g class="bp" data-id="VR2"><rect class="bhl" x="428" y="148" width="84" height="104"/>`+potBody(470,190,POS.VR2,V.VR2,1,true)+BL(470,244,'VR2')+`</g>`;
  s+=BW('M504 190H555V108H590V124','j')+BW('M590 124V116H610V124','j')+BD(525,190);
  s+=`<g class="bp" data-id="C2"><rect class="bhl" x="494" y="268" width="56" height="60"/>`+leg(525,190,525,330)+capBody(525,300,V.C2,false)+BL(512,322,'C2','end')+`</g>`+BD(525,330);
  s+=BW('M570 124V40','vp')+BW('M570 236V330','gnd')+BW('M630 236V256H666V40','vp')+BD(570,40)+BD(570,330)+BD(666,40);
  s+=`<g class="bp" data-id="IC2"><rect class="bhl" x="552" y="118" width="96" height="124"/>`+boardChip(560,132,'IC2')+`</g>`;
  const o='M610 236V262H690';s+=BW(o,'out')+`<path class="flow y" d="${o}"/>`;
  s+=`<g class="bp" data-id="C3"><rect class="bhl" x="694" y="240" width="72" height="46"/>`+leg(690,262,770,262)+capBody(730,262,V.C3,true)+BL(730,300,'C3')+`</g>`;
  s+=`<g class="bp" data-id="R3"><rect class="bhl" x="742" y="166" width="40" height="100"/>`+leg(770,262,770,170)+resBody(770,216,false,V.R3)+BL(762,212,'R3','end')+`</g>`+BD(770,262);
  s+=BW('M770 170H835V202','out');

  s+=BL(450,22,'VISTA DE PLACA · ILUSTRATIVA','middle','#9C9B97',9);
  const svg=sv('svg',{id:'board',viewBox:'0 0 900 360',role:'img','aria-label':'Placa ilustrativa con las piezas y sus valores actuales'},s);
  box.innerHTML='';box.append(svg);svg.addEventListener('click',e=>{const g=e.target.closest('.bp');if(g)select(g.dataset.id);});updBoard();}
function updBoard(){document.querySelectorAll('#board .bp').forEach(g=>g.classList.toggle('sel',g.dataset.id===sel));}

/* ===================== 05 · materiales ===================== */
function renderBOM(){const tb=$('#bomb');tb.innerHTML='';
  for(const id of ORDER){if(IC[id]){tb.append(h('tr',{class:'lk',onclick:()=>{select(id);$('#circuito').scrollIntoView({behavior:'smooth'});}},h('td',{class:'r'},id),h('td',null,'Timer 555 · '+IC[id].name),h('td',{class:'v'},'NE555'),h('td',null,'DIP-8'),h('td',null,'fijo')));continue;}
    const p=PM[id],v=V[id];let cd=code(id);let bd=null;
    if(p.k==='r'){const b=bands(v);bd=h('span',{class:'bands'},b.c.map(c=>h('i',{style:'background:'+c})));cd=b.n.join(' · ');}
    tb.append(h('tr',{onclick:()=>{select(id);$('#circuito').scrollIntoView({behavior:'smooth'});}},h('td',{class:'r'},p.ref),h('td',null,p.name),h('td',{class:'v'},fmtV(v,p.u)),h('td',null,bd,cd),h('td',null,v===DEF[id]?'original':'cambiado')));}}
function bomText(){return ORDER.map(id=>IC[id]?`${id}\tNE555\tTimer 555`:`${PM[id].ref}\t${fmtV(V[id],PM[id].u)}\t${PM[id].name}${PM[id].k==='pot'?' (lineal)':''}`).join('\n')+'\nJack o bornera de salida, cables, placa';}

/* ===================== osciloscopio ===================== */
let sweep=0,raf=0,last=0;
function drawScope(){const cv=$('#scope'),r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
  if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);}
  const g=cv.getContext('2d'),w=cv.width,hh=cv.height,c=calc();
  const win=clamp(3*c.To,1e-4,.3),N=Math.min(1600,Math.round(w/1.2));const T=traces(win,N);
  g.fillStyle='#0B0B0C';g.fillRect(0,0,w,hh);
  g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=1;for(let i=1;i<10;i++){g.beginPath();g.moveTo(w*i/10,0);g.lineTo(w*i/10,hh);g.stroke();}
  const lanes=[['C1 · pata 6 IC1',T.c1,0,V.VCC,'#2A9EBF'],['OUT · pata 3 IC1',T.o1,0,V.VCC,'#9C9B97'],['C2 · pata 6 IC2',T.c2,0,V.VCC,'#E1C43B'],['PARLANTE',T.sp,null,null,'#D12F7D']];
  const lh=hh/4,sx=Math.floor(sweep*N);
  lanes.forEach(([name,arr,lo,hi,col],k)=>{const y0=k*lh+6*dpr,y1=(k+1)*lh-6*dpr;
    if(lo==null){let m=1e-6;for(const v of arr)m=Math.max(m,Math.abs(v));lo=-m*1.05;hi=m*1.05;}
    g.strokeStyle='rgba(255,255,255,.12)';g.beginPath();g.moveTo(0,(k+1)*lh);g.lineTo(w,(k+1)*lh);g.stroke();
    if(k<3){g.setLineDash([3*dpr,5*dpr]);g.strokeStyle='rgba(255,255,255,.18)';for(const f of [1/3,2/3]){if(k===1)break;const yy=y1-(y1-y0)*f;g.beginPath();g.moveTo(0,yy);g.lineTo(w,yy);g.stroke();}g.setLineDash([]);}
    const draw=(a,b,alpha,lw)=>{g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=lw;g.beginPath();for(let i=a;i<b;i++){const x=i/(N-1)*w,y=y1-(y1-y0)*(arr[i]-lo)/(hi-lo);i===a?g.moveTo(x,y):g.lineTo(x,y);}g.stroke();g.globalAlpha=1;};
    if(playing&&!matchMedia('(prefers-reduced-motion: reduce)').matches){draw(0,N,.35,1.6*dpr);draw(Math.max(0,sx-N*.35|0),sx+1,1,2.4*dpr);}else draw(0,N,1,2*dpr);
    g.fillStyle=col;g.font=`600 ${10*dpr}px "IBM Plex Mono",monospace`;g.textBaseline='top';g.fillText(name,6*dpr,k*lh+5*dpr);});
  if(playing){const x=sweep*w;g.fillStyle='rgba(240,239,234,.5)';g.fillRect(x-1,0,2*dpr,hh);}
  $('#scinfo').textContent=fmtT(win/10)+' / div';}
function startAnim(){cancelAnimationFrame(raf);if(!playing){drawScope();return;}
  const loop=t=>{const dt=last?(t-last)/1000:0;last=t;sweep=(sweep+dt*.6)%1;drawScope();if(padDown||trail.length)drawPad();raf=requestAnimationFrame(loop);};last=0;raf=requestAnimationFrame(loop);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else startAnim();});

/* ===================== cambios ===================== */
let frameQ=false,qOpts={};
function changed(keepSlider,from){sendAudio();qOpts.keep=qOpts.keep||keepSlider;qOpts.from=from;if(frameQ)return;frameQ=true;requestAnimationFrame(()=>{frameQ=false;const o=qOpts;qOpts={};
  const c=calc();$('#ro-fa').textContent=fmtF(c.fa);$('#ro-tm').textContent=fmtT(c.Tm);$('#ro-n').innerHTML='<em>÷'+c.n+'</em>';$('#ro-fo').textContent=fmtF(c.fo)+' · '+nota(c.fo);
  $('#hdv').textContent=fmtV(V.VCC,'V');
  updSch();updEditorLive(o.keep);updKnobs();if(!playing)drawScope();drawPad();drawStair();
  const bkey=JSON.stringify([V,POS.VR1.toFixed(2),POS.VR2.toFixed(2)]);if(bkey!==renderBoard.k){renderBoard.k=bkey;renderBoard();}
  renderBOM();save();});}

/* ===================== armado ===================== */

        h('div',{class:'padax'},h('span',null,'← VR1 · reloj →'),h('span',null,'↕ VR2 · pulso'),h('span',null,'cada color = una división ÷n · brillo = altura'))),
      h('div',null,h('div',{class:'knobs',id:'knobs'}),h('div',{class:'row',style:'margin-top:10px;justify-content:center'},

  m.append(h('section',{id:'escalera',class:'panel p-paper'},h('div',{class:'in'},secHead('03','La escalera','FRECUENCIA DE SALIDA SEGÚN EL EJE DE VR1 · VR2 FIJO'),
    h('canvas',{id:'stair','aria-label':'Gráfico de la frecuencia de salida según la posición de VR1. Arrastrá para mover VR1'}),
    h('p',{class:'note'},'Línea punteada: el reloj de IC1. Línea gruesa: lo que suena. IC2 sólo acepta un disparo cuando terminó su pulso, así que la salida es el reloj dividido por un entero (÷1, ÷2, ÷3…). Cada salto de color es un cambio de división: ése es el sonido "de escalones" de la Atari Punk. Arrastrá sobre el gráfico para mover VR1.'))));
  m.append(h('section',{id:'placa',class:'panel p-ink'},h('div',{class:'in'},secHead('04','La placa','PIEZAS REALES · BANDAS Y CÓDIGOS AL DÍA'),
    h('div',{class:'boardwrap',id:'boardwrap'}),
    h('p',{class:'note'},'Las bandas de las resistencias, el código de los cerámicos (103 = 10 nF) y la posición de los potes cambian con tus valores. Un condensador de 1 µF o más se dibuja como electrolítico: respetá la polaridad. Rojo/magenta: +V · gris: masa · cian: reloj · amarillo: salida.'))));
  m.append(h('section',{id:'materiales',class:'panel p-paper'},h('div',{class:'in'},secHead('05','Lista de materiales','BOM · '+ORDER.length+' PIEZAS'),
    h('div',{class:'tblw'},h('table',null,h('thead',null,h('tr',null,['Ref','Pieza','Valor','Código','Estado'].map(t=>h('th',null,t)))),h('tbody',{id:'bomb'}))),
    h('div',{class:'row',style:'margin-top:10px'},h('button',{class:'btn acc',onclick:()=>{const t=bomText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Lista copiada')).catch(()=>{toast('No se pudo copiar');});}},'Copiar lista')),
    h('div',{class:'hz'}))));}

renderBar();buildMain();renderSch();renderBoard();renderEditor();renderKnobs();bindPad();bindStair();changed();
addEventListener('resize',()=>{drawScope();drawPad();drawStair();});
