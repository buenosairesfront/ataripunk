<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>U-MA Atari Punk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Atari Punk Console con dos NE555: cambiá cada pieza, mirá el osciloscopio y escuchá la salida en vivo. U-MA サウンド">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&text=%E3%82%B5%E3%82%A6%E3%83%B3%E3%83%89&display=swap" rel="stylesheet">
<style>
/* Layout: hoja técnica U-MA — osciloscopio arriba, fichas numeradas: circuito editable → tocar → escalera → placa → materiales */
:root{
  --bg:#C8C9C5; --paper:#F0EFEA; --paperFg:#141414; --paperLine:rgba(20,20,20,.22); --paperMute:#5E5E5A;
  --ink:#121314; --mag:#D12F7D; --cya:#2A9EBF; --yel:#E1C43B; --grey:#8D8E8A;
  --disp:"Barlow Condensed","Noto Sans JP","Hiragino Sans","PingFang SC","Noto Sans SC","Noto Sans Devanagari",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Hiragino Sans","PingFang SC","Noto Sans SC","Noto Sans Devanagari",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#08090A; --paper:#1C1D1F; --paperFg:#EAE8E2; --paperLine:rgba(255,255,255,.16); --paperMute:#9B9A95; --ink:#000; --grey:#6A6B68; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#08090A; --paper:#1C1D1F; --paperFg:#EAE8E2; --paperLine:rgba(255,255,255,.16); --paperMute:#9B9A95; --ink:#000; --grey:#6A6B68; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0; overflow:hidden; background:var(--bg); color:var(--paperFg); font:14px/1.45 var(--mono); -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:0}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer; touch-action:manipulation}
:focus-visible{outline:2px solid var(--cya); outline-offset:2px}
.app{max-width:1060px; margin:0 auto; height:100%; display:flex; flex-direction:column}
/* zona fija: primer tercio */
.dock{flex:none; height:33.333%; min-height:208px; max-height:420px; display:flex; flex-direction:column; gap:6px; padding:6px 0 8px; border-bottom:1.5px solid var(--paperFg); background:var(--bg); position:relative; z-index:2}
.dbar{flex:none; display:flex; align-items:center; gap:6px; height:32px}
.dbar .logo{height:30px}
#scope{flex:1; min-width:0; height:32px; display:block; border:1.5px solid var(--paperFg); background:#0B0B0C}
.langsel{flex:none; height:32px; border:1.5px solid var(--paperFg); background:var(--paper); color:var(--paperFg); font:600 12px/1 var(--mono); padding:0 4px; border-radius:0}
.dbar .play{height:32px; padding:0 10px; font-size:12px; gap:6px}
.dbar .play i{width:8px; height:8px}
.dgrid{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) 54px; gap:6px}
.dcell{position:relative; min-height:0; min-width:0; border:1.5px solid var(--paperFg); overflow:hidden}
.padcell{background:#0B0B0C}
.stcell{background:var(--paper)}
#pad,#stair{display:block; width:100%; height:100%; touch-action:none}
#pad{cursor:crosshair} #stair{cursor:ew-resize}
.tag{position:absolute; left:5px; top:4px; font:600 9px/1.1 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:#F0EFEA; text-shadow:0 1px 0 #000; pointer-events:none}
.padhud{position:absolute; left:5px; bottom:4px; pointer-events:none; color:#F0EFEA; text-shadow:0 1px 0 #000}
.padhud b{display:block; font:800 clamp(14px,2.8vh,24px)/.95 var(--disp)}
.padhud span{font:600 9px var(--mono); letter-spacing:.04em; opacity:.9}
.dock .knobs{display:flex; flex-direction:column; justify-content:space-between; align-items:center; min-height:0}
.knob{display:flex; flex-direction:column; align-items:center; text-align:center; min-height:0}
.knob svg{height:clamp(24px,6.6vh,58px); width:auto; touch-action:none; cursor:ns-resize; display:block}
.knob b{font:800 12px/1 var(--disp); text-transform:uppercase; margin-top:1px}
.knob span{font:600 8.5px/1.1 var(--mono); color:var(--paperMute)}
@media (min-width:761px){ .dgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) 72px} .knob b{font-size:14px} .knob span{font-size:10px} .tag{font-size:10px} .padhud span{font-size:10.5px} }
.scroller{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding-bottom:48px}
.scroller .scopecard .note{color:var(--pm)}
.scroller .scopecard .note b{color:var(--pf); font-weight:700}

.p-paper{--pb:var(--paper); --pf:var(--paperFg); --pl:var(--paperLine); --pm:var(--paperMute); --pa:var(--mag); --pat:#fff}
.p-ink{--pb:var(--ink); --pf:#ECEBE6; --pl:rgba(255,255,255,.2); --pm:#9C9B97; --pa:var(--cya); --pat:#0B0B0B}
.p-mag{--pb:var(--mag); --pf:#101010; --pl:rgba(0,0,0,.32); --pm:rgba(0,0,0,.68); --pa:#101010; --pat:var(--mag)}
.panel{background:var(--pb); color:var(--pf); border:1.5px solid var(--pf); outline:1.5px solid var(--pb); position:relative}
.panel::after{content:""; position:absolute; inset:5px; border:1px solid var(--pl); pointer-events:none}
.panel>.in{padding:14px 16px 18px; position:relative; z-index:1}

.top{padding:10px 0 0}
.bar{display:flex; align-items:center; gap:10px}
.logo{height:42px; width:auto; flex:none; display:block}
.title{flex:1; min-width:0}
.title b{display:block; font:800 clamp(20px,5.4vw,30px)/.95 var(--disp); text-transform:uppercase; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.title small{display:flex; gap:10px; font:500 10.5px/1.3 var(--mono); color:var(--paperMute); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; white-space:nowrap; overflow:hidden}
.play{height:40px; padding:0 14px; border:1.5px solid var(--paperFg); background:var(--mag); color:#fff; font:700 13px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; display:inline-flex; align-items:center; gap:8px; flex:none}
.play i{width:10px; height:10px; background:#fff; display:block; clip-path:polygon(0 0,100% 50%,0 100%)}
.play[aria-pressed="true"]{background:var(--paperFg); color:var(--paper)}
.play[aria-pressed="true"] i{clip-path:none; background:var(--mag); animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

.scopecard{margin-top:10px}
.scopecard>.in{padding:10px 12px}
.meta{display:flex; justify-content:space-between; gap:8px; font:500 10px/1.2 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--pm); flex-wrap:wrap}
.readout{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--pl)}
.readout div{padding:4px 6px 0; border-left:1px solid var(--pl); min-width:0}
.readout div:first-child{border-left:0; padding-left:0}
.readout span{display:block; font:500 9.5px/1.2 var(--mono); color:var(--pm); letter-spacing:.08em; text-transform:uppercase}
.readout b{display:block; font:700 21px/1.1 var(--disp); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums}
.readout b em{font-style:normal; color:var(--mag)}
@media (max-width:640px){ .readout{grid-template-columns:1fr 1fr} .readout div:nth-child(3){border-left:0; padding-left:0} }

section{margin-top:18px}
.sh{border-bottom:1.5px solid var(--pf); margin-bottom:12px; padding-bottom:8px}
.sh .meta{margin-bottom:6px}
.shm{display:flex; align-items:flex-end; gap:8px 12px; flex-wrap:wrap}
.num{font:800 52px/.82 var(--disp); letter-spacing:-.02em; flex:none}
.shm h2{margin:0; font:700 26px/1 var(--disp); text-transform:uppercase; letter-spacing:.02em; text-wrap:balance}
.shm .aside{display:flex; gap:6px; align-items:center; flex:none; margin-left:auto}
.sq{display:flex; gap:3px; margin-bottom:4px}
.sq i{width:9px; height:9px; border:1px solid var(--pf)}
.sq i.m{background:var(--mag)} .sq i.c{background:var(--cya)} .sq i.y{background:var(--yel)}
.lbl{font:500 10.5px/1.2 var(--mono); color:var(--pm); text-transform:uppercase; letter-spacing:.08em; margin:14px 0 6px}
.note{color:var(--pm); font-size:12px; margin:10px 0 0; max-width:72ch}
.btn{border:1.5px solid var(--pf); background:var(--pb); color:var(--pf); padding:7px 11px; font:600 12px/1 var(--mono); text-transform:uppercase; letter-spacing:.04em; min-height:34px; white-space:nowrap}
.btn.acc{background:var(--pa); color:var(--pat); border-color:var(--pa)}
.btn[aria-pressed="true"]{background:var(--pf); color:var(--pb)}
.row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.hz{height:12px; margin-top:14px; background:repeating-linear-gradient(-45deg,var(--pf) 0 6px,transparent 6px 12px); border:1.5px solid var(--pf)}

/* 01 circuito */
.schwrap{border:1.5px solid var(--pf); background:var(--paper); overflow-x:auto}
#sch{display:block; width:100%; min-width:660px; user-select:none}
#sch .w{fill:none; stroke:var(--pf); stroke-width:2; stroke-linejoin:round}
#sch .dot{fill:var(--pf)}
#sch .part{cursor:pointer}
#sch .hl{fill:transparent; stroke:none}
#sch .part:hover .hl{fill:var(--pl)}
#sch .part.sel .hl{fill:rgba(209,47,125,.16); stroke:var(--mag); stroke-width:1.5; stroke-dasharray:5 3}
#sch .body{fill:var(--paper); stroke:var(--pf); stroke-width:2}
#sch .part.sel .body{fill:var(--mag)}
#sch .pl{fill:none; stroke:var(--pf); stroke-width:3}
#sch text{fill:var(--pf)}
#sch .ref{font:700 16px var(--disp)}
#sch .val{font:600 11px var(--mono); fill:var(--pm)}
#sch .pin{font:600 9px var(--mono); fill:var(--pm)}
#sch .pn{font:700 9px var(--mono)}
#sch .cb{fill:url(#hatch); stroke:var(--pf); stroke-width:2}
#sch .chipt{font:800 22px var(--disp)}
#sch .chips{font:600 10px var(--mono); fill:var(--pm); letter-spacing:.06em}
#sch .hatchl{stroke:var(--pl); stroke-width:1.2}
#sch .arrow{fill:var(--pf)}
.flow{fill:none; stroke-width:3.5; stroke-dasharray:3 14; opacity:0; transition:opacity .2s}
.flow.c{stroke:var(--cya)} .flow.m{stroke:var(--mag)} .flow.y{stroke:var(--yel)}
body.on .flow{opacity:1; animation:flow .45s linear infinite}
@keyframes flow{to{stroke-dashoffset:-17}}
.partbar{display:flex; flex-wrap:wrap; gap:4px; margin-top:12px}
.pbt{border:1.5px solid var(--pf); background:transparent; color:var(--pf); padding:6px 8px; font:700 16px/1 var(--disp); min-height:34px; display:inline-flex; gap:6px; align-items:baseline}
.pbt small{font:500 10px/1 var(--mono); color:var(--pm)}
.pbt[aria-pressed="true"]{background:var(--pf); color:var(--pb)}
.pbt[aria-pressed="true"] small{color:inherit; opacity:.75}
.pbt.lock{border-style:dashed}
.ed{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr); gap:18px; margin-top:10px; border:1.5px solid var(--pf); padding:14px}
@media (max-width:760px){ .ed{grid-template-columns:1fr} }
.edref{font:800 66px/.85 var(--disp); letter-spacing:-.01em}
.edref em{font-style:normal; color:var(--mag)}
.edname{font:700 21px/1.05 var(--disp); text-transform:uppercase; margin-top:6px}
.edmini{margin-top:10px; border:1.5px solid var(--pf); background:#121314; height:96px}
.edmini svg{display:block; width:100%; height:100%}
.role{font-size:12.5px; margin:10px 0 0}
.bigval{font:800 clamp(44px,8vw,68px)/.9 var(--disp); font-variant-numeric:tabular-nums; white-space:nowrap}
.code{font:600 11px/1.3 var(--mono); color:var(--pm); text-transform:uppercase; letter-spacing:.06em; margin-top:6px}
.vrow{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:10px}
.vrow input[type=text]{width:120px; border:1.5px solid var(--pf); background:transparent; padding:7px 9px; font:600 13px var(--mono); min-height:34px; color:var(--pf)}
input[type=range]{width:100%; accent-color:var(--mag); margin:10px 0 0}
.eff{margin-top:10px; font-size:12.5px; border-left:3px solid var(--mag); padding-left:10px}
.live{display:flex; gap:8px 18px; flex-wrap:wrap; margin-top:12px; border-top:1px solid var(--pl); padding-top:8px}
.live span{display:block; font:500 9.5px/1.2 var(--mono); color:var(--pm); letter-spacing:.08em; text-transform:uppercase}
.live b{font:700 22px/1.1 var(--disp); font-variant-numeric:tabular-nums}
.lockbox{border:1.5px dashed var(--pf); padding:10px 12px; margin-top:10px; background:repeating-linear-gradient(-45deg,transparent 0 7px,var(--pl) 7px 8px)}
.lockbox b{font:800 26px/1 var(--disp)}
.pinlist{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px; margin-top:10px; font-size:12px}
.pinlist div{border:1px solid var(--pl); padding:4px 6px}
.pinlist b{font:700 15px var(--disp); margin-right:6px}

/* escalera/tocar: en la zona fija */
#gatebtn{min-height:30px; padding:6px 9px; font-size:11px}

/* combinaciones */
.combos{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px}
.combos input{width:150px; border:1.5px solid var(--pf); background:transparent; padding:7px 9px; font:600 12px var(--mono); min-height:34px; color:var(--pf)}
.chipc{display:inline-flex; border:1.5px solid var(--pf)}
.chipc button{border:0; background:transparent; color:var(--pf); min-height:31px; padding:6px 9px; font:700 15px/1 var(--disp); text-transform:uppercase}
.chipc button small{font:500 9.5px var(--mono); color:var(--pm); margin-left:6px; text-transform:none}
.chipc button.x{border-left:1px solid var(--pl); padding:6px 8px; font:600 12px var(--mono); color:var(--pm)}
.chipc.on{background:var(--pf)} .chipc.on button{color:var(--pb)} .chipc.on button small{color:inherit; opacity:.7}
.empty{font:500 11px var(--mono); color:var(--pm)}

/* 04 placa */
.boardwrap{overflow-x:auto; border:1.5px solid var(--pf)}
#board{display:block; width:100%; min-width:660px; user-select:none}
#board .bp{cursor:pointer}
#board .bhl{fill:none; stroke:none}
#board .bp:hover .bhl{stroke:rgba(255,255,255,.35); stroke-width:1.5; stroke-dasharray:4 3}
#board .bp.sel .bhl{stroke:var(--mag); stroke-width:2.5; stroke-dasharray:6 3; fill:rgba(209,47,125,.12)}
#board text{font-family:var(--mono)}

/* 05 materiales */
.tblw{overflow-x:auto; border:1.5px solid var(--pf)}
table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:520px}
th{font:600 10px var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--pm); text-align:left; padding:7px 10px; border-bottom:1.5px solid var(--pf)}
td{padding:7px 10px; border-top:1px solid var(--pl); vertical-align:middle}
td.r{font:800 18px var(--disp)}
td.v{font:700 17px var(--disp); white-space:nowrap}
tr.lk td{color:var(--pm)}
tr.lk td.r{color:var(--pf)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--pl)}
.bands{display:inline-flex; gap:2px; vertical-align:middle; margin-right:6px}
.bands i{width:7px; height:16px; border:1px solid var(--pf)}
.foot{margin-top:24px; font:500 10.5px/1.5 var(--mono); color:var(--paperMute); text-transform:uppercase; letter-spacing:.06em; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
.toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--paperFg); color:var(--paper); padding:8px 14px; font:600 12px var(--mono); text-transform:uppercase; letter-spacing:.06em; z-index:20}
.scrollhint{display:none; font:600 11px/1.2 var(--mono); color:var(--pm); text-transform:uppercase; letter-spacing:.06em; margin:6px 0 0}
/* celular: todo más grande y legible */
@media (max-width:640px){
  body{font-size:15px}
  .panel>.in{padding:14px 13px 16px}
  .title b{white-space:normal; font-size:clamp(22px,6.4vw,30px); line-height:.95}
  .title small{flex-wrap:wrap; gap:2px 10px; font-size:11px; white-space:normal}
  .meta{font-size:11px}
  .readout span{font-size:11px}
  .readout b{font-size:23px; white-space:normal; line-height:1.05; padding-bottom:2px}
  .num{font-size:56px}
  .shm h2{font-size:30px}
  .lbl{font-size:12px}
  .note{font-size:13.5px; line-height:1.5}
  .empty{font-size:12.5px}
  .btn{font-size:13.5px; min-height:42px; padding:9px 13px}
  .vrow input[type=text],.combos input{min-height:42px; font-size:15px; flex:1 1 120px; width:auto}
  .schwrap,.boardwrap{-webkit-overflow-scrolling:touch}
  #sch,#board{min-width:780px}
  #sch .ref{font-size:19px} #sch .val{font-size:12.5px} #sch .pin,#sch .pn{font-size:11px}
  #sch .chipt{font-size:26px} #sch .chips{font-size:12.5px}
  .scrollhint{display:block}
  .pbt{font-size:19px; min-height:44px; padding:8px 10px}
  .pbt small{font-size:12px}
  .edname{font-size:24px}
  .edmini{height:120px}
  .role,.eff{font-size:14px}
  .code{font-size:12px}
  .bigval{font-size:clamp(52px,15vw,68px)}
  .live span{font-size:11px} .live b{font-size:25px}
  input[type=range]{height:30px}
  .pinlist{grid-template-columns:1fr; font-size:13.5px}
  .pinlist div{padding:7px 8px}
  .chipc button{min-height:40px; font-size:17px}
  .chipc button small{font-size:11px}
  table{font-size:14px}
  th{font-size:11.5px}
  td.r{font-size:20px} td.v{font-size:19px}
  .foot{font-size:11.5px}
  .toast{font-size:13px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>

<div class="app">
  <div class="dock" id="dock"></div>
  <div class="scroller" id="scroller">
    <header class="top"><div class="bar" id="bar"></div></header>
    <main id="main"></main>
    <div class="foot"><span id="foot"></span><span>U-MA サウンド</span></div>
  </div>
</div>

<script>
/* ===================== utilidades ===================== */
const $=(q,r=document)=>r.querySelector(q);
function h(tag,a,...kids){const e=document.createElement(tag);if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const NS='http://www.w3.org/2000/svg';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

e:"Gate: free",gateTouch:"Gate: on touch",howTo:"How to play",playNote:"On the pad, horizontal = VR1 (clock) and vertical = VR2 (pulse). Each color is a ÷n division; brightness is pitch. With Gate “on touch”, it only sounds while your finger is down.",stairNote:"Dotted line: IC1’s clock. Thick line: what you hear. IC2 only accepts a trigger once its pulse has ended, so the output is the clock divided by a whole number (÷1, ÷2, ÷3…). Each color jump is a change of division: that is the Atari Punk’s “stepped” sound. Drag on the chart to move VR1.",readings:"Readings",s2:"The board",s2m:"Real parts · bands and codes up to date",boardLbl:"Board view · illustrative",boardAria:"Illustrative board with the parts and their current values",swipeBoard:"← swipe the board to see it all →",boardNote:"Resistor bands, ceramic codes (103 = 10 nF) and pot positions follow your values. A capacitor of 1 µF or more is drawn as an electrolytic: mind the polarity. Red/magenta: +V · grey: ground · cyan: clock · yellow: output.",s3:"Bill of materials",pieces:"parts",th:"Ref,Part,Value,Code,Status",timer:"555 timer",changedS:"changed",original:"original",export:"Export list",exportHint:"PNG with the list, the values and the staircase",name:"Name",comboName:"Combination name",myCombos:"My combinations",save:"Save",none:"none saved yet",del:"Delete",delQ:"delete?",deleted:"Deleted",load:"Load",nostore:"This browser can’t save",needName:"Enter a name",updated:"Updated",saved:"Saved",loaded:"Loaded",unnamed:"Untitled",batt:"Battery",axes:"Shafts at export",extras:"plus: output jack or terminal, wires, board",cap100:"100 µF between +V and ground",credit2:"Original design by Forrest M. Mims III (Stepped Tone Generator) · values calculated by the app’s simulation",expFail:"Could not export",exported:"Exported",foot:"Atari Punk Console · original design by Forrest M. Mims III (Stepped Tone Generator) · approximate simulation, no real 555 loading",lang:"Language",locale:"en-US",ic1n:"Astable · the c PM:{VCC:["Battery","Powers both 555s. The NE555 runs from 4.5 to 16 V; its high output sits about 1.7 V below the supply.","More voltage: more volume. The frequency stays the same, because the 555 compares against 1/3 and 2/3 of that same voltage."],
R1:["Clock limit","Runs from +V to pin 7 of IC1. With VR1 at minimum it is the only thing slowing C1’s charge: it sets the clock’s highest pitch and protects the discharge pin.","Larger: with VR1 at minimum the clock doesn’t go as high."],
VR1:["Clock pot","Rheostat between pin 7 and pins 6 and 2 of IC1. It sets the astable frequency: the pulse train that triggers IC2.","Higher value: the sweep reaches lower frequencies. Its position is played on the pad."],
C1:["Clock timing","Charges through R1+VR1 and discharges through VR1, between 1/3 and 2/3 of Vcc. f = 1.44 / ((R1 + 2·VR1)·C1).","Larger: the whole clock slows down."],
R2:["Pulse limit","In series with VR2, between +V and pins 6 and 7 of IC2. Sets the monostable’s shortest pulse.","Larger: the minimum pulse gets longer."],
VR2:["Pulse pot","Sets how long IC2’s pulse lasts. While the pulse is high, IC2 ignores clock triggers: that is why the output jumps in steps (÷1, ÷2, ÷3…).","Higher value: longer pulses and more possible divisions."],
C2:["Pulse timing","The monostable capacitor. Pulse length: T = 1.1·(R2+VR2)·C2.","Larger: longer pulse, lower notes and more steps."],
C3:["Output coupling","Between pin 3 of IC2 and the speaker. Blocks DC; with R3 and the speaker it forms a high-pass filter.","Smaller: the lows go and the sound gets thinner."],
R3:["Output resistor","Limits the current from pin 3 of IC2 and lowers the volume on the speaker.","Larger: less volume and less current."],
SPK:["Speaker","The load. Its impedance, added to R3, sets the volume and, with C3, where the lows are cut.","More ohms: more voltage across the speaker and a lower bass cutoff."]},
USB:["USB 5 V supply","USB 5 V input: charger, computer or power bank. The NE555 needs at least 4.5 V, so it works at 5 V, but close to the edge. The high output sits around 3.3 V. Note: some power banks switch off by themselves at such a low draw.","Less voltage, less volume: on USB, use R3 = 100 Ω. Add a 100 µF electrolytic between +V and ground, close to the 555s, to filter USB noise."]},

verticale VR2. Chaque couleur est une division différente",stairAria:"Graphique de la fréquence de sortie selon la position de VR1. Glissez pour déplacer VR1",play:"Jouer",stair:"Escalier",gateFree:"Gate : libre",gateTouch:"Gate : au toucher",howTo:"Comment jouer",playNote:"Sur le pad, horizontale = VR1 (horloge) et verticale = VR2 (impulsion). Chaque couleur est une division ÷n ; la luminosité indique la hauteur. Avec Gate « au toucher », le son ne sort que tant que le doigt est posé.",stairNote:"Ligne pointillée : l’horloge d’IC1. Ligne épaisse : ce qu’on entend. IC2 n’accepte un déclenchement qu’une fois son impulsion terminée, donc la sortie est l’horloge divisée par un entier (÷1, ÷2, ÷3…). Chaque saut de couleur est un changement de division : c’est le son « à paliers » de l’Atari Punk. Glissez sur le graphique pour déplacer VR1.",readings:"Mesures",s2:"La carte",s2m:"Pièces réelles · anneaux et codes à jour",boardLbl:"Vue de la carte · illustrative",boardAria:"Carte illustrative avec les pièces et leurs valeurs actuelles",swipeBoard:"← faites glisser la carte pour tout voir →",boardNote:"Les anneaux des résistances, le code des céramiques (103 = 10 nF) et la position des potentiomètres suivent vos valeurs. Un condensateur de 1 µF ou plus est dessiné en électrolytique : respectez la polarité. Rouge/magenta : +V · gris : masse · cyan : horloge · jaune : sortie.",s3:"Liste des composants",pieces:"pièces",th:"Réf,Pièce,Valeur,Code,État",timer:"Timer 555",changedS:"modifié",original:"origine",export:"Exporter la liste",exportHint:"PNG avec la liste, les valeurs et l’escalier",name:"Nom",comboName:"Nom de la combinaison",myCombos:"Mes combinaisons",save:"Enregistrer",none:"aucune enregistrée pour l’instant",del:"Supprimer",delQ:"supprimer ?",deleted:"Supprimée",load:"Charger",nostore:"Ce navigateur ne peut pas enregistrer",needName:"Donnez un nom",updated:"Mise à jour",saved:"Enregistrée",loaded:"Chargée",unnamed:"Sans nom",batt:"Pile",axes:"Axes à l’export",extras PM:{VCC:["Pile","Alimente les deux 555. Le NE555 fonctionne entre 4,5 et 16 V ; sa sortie haute reste environ 1,7 V sous l’alimentation.","Plus de tension : plus de volume. La fréquence ne change pas, car le 555 compare à 1/3 et 2/3 de cette même tension."],
R1:["Butée de l’horloge","Va de +V à la broche 7 d’IC1. Avec VR1 au minimum, c’est la seule chose qui freine la charge de C1 : elle fixe l’aigu maximal de l’horloge et protège la décharge.","Plus grande : avec VR1 au minimum, l’horloge monte moins haut."],
VR1:["Potentiomètre d’horloge","Rhéostat entre la broche 7 et les broches 6 et 2 d’IC1. Il règle la fréquence de l’astable : le train d’impulsions qui déclenche IC2.","Valeur plus grande : la course descend vers des fréquences plus graves. La position se joue sur le pad."],
C1:["Timing de l’horloge","Se charge via R1+VR1 et se décharge via VR1, entre 1/3 et 2/3 de Vcc. f = 1,44 / ((R1 + 2·VR1)·C1).","Plus grand : toute l’horloge ralentit."],
R2:["Butée de l’impulsion","En série avec VR2, entre +V et les broches 6 et 7 d’IC2. Fixe l’impulsion la plus courte du monostable.","Plus grande : l’impulsion minimale s’allonge."],
VR2:["Potentiomètre d’impulsion","Règle la durée de l’impulsion d’IC2. Tant que l’impulsion est haute, IC2 ignore les déclenchements de l’horloge : c’est pourquoi la sortie saute par paliers (÷1, ÷2, ÷3…).","Valeur plus grande : impulsions plus longues et plus de divisions possibles."],
C2:["Timing de l’impulsion","Condensateur du monostable. Durée de l’impulsion : T = 1,1·(R2+VR2)·C2.","Plus grand : impulsion plus longue, notes plus graves et plus de paliers."],
C3:["Couplage de sortie","Entre la broche 3 d’IC2 et le haut-parleur. Bloque le continu ; avec R3 et le haut-parleur, il forme un filtre passe-haut.","Plus petit : les graves partent et le son s’amincit."],
R3:["Résistance de sortie","Limite le courant fourni par la broche 3 d’IC2 et baisse le volume sur le haut-parleur.","Plus grande : moins de volume et moins de courant."],
SPK:["Haut-parleur","La charge. Son impédance, ajoutée à R3, décide du volume et, avec C3, de la coupure des graves.","Plus d’ohms : plus de tension sur le haut-parleur et coupure des graves plus basse."]},
USB:["Alimentation USB 5 V","Entrée USB 5 V : chargeur, ordinateur ou batterie externe. Le NE555 demande au moins 4,5 V : à 5 V il fonctionne, mais près de la limite. La sortie haute reste vers 3,3 V. Attention : certaines batteries externes s’éteignent seules avec une si faible consommation.","Moins de tension, moins de volume : en USB, mieux vaut R3 = 100 Ω. Ajoutez un électrolytique de 100 µF entre +V et masse, près des 555, pour filtrer le bruit de l’USB."]},

de:{snd:"Ton",sndOn:"Läuft",noaudio:"Der Browser konnte kein Audio öffnen",sub:"Stufen-Konsole",astmono:"astabil → monostabil",astU:"ASTABIL",monoU:"MONOSTABIL",bat9:"Batterie 9 V",r3to:"R3 auf",scopeAria:"Oszilloskop: Spannung an C2 und Lautsprechersignal",clockIC:"Takt · IC1",pulseIC:"Puls · IC2",div:"Teilung",out:"Ausgang",s1:"Die Schaltung",s1m:"Schaltplan · tippe ein Bauteil an, um es zu ändern",presets:"Rezepte",presetT:"Rezept",p0:"Klassisch",p1:"Tief",p2:"Zirpen",p3:"Viele Stufen",p4:"Lo-fi 5 V",restore:"Zurücksetzen",origVals:"Originalwerte",supply:"Versorgung",bat9b:"9 V · Batterie",min45:"der NE555 braucht mindestens 4,5 V",swipeSch:"← Schaltplan wischen, um alles zu sehen →",note1:"Alle Widerstände, Potis, Kondensatoren, die Batterie und der Lautsprecher lassen sich tauschen. Schreib den Wert wie auf der Platine: 4k7, 10n, 100u, 2M2. Die beiden NE555 bleiben fest.",schAria:"Schaltplan der Atari Punk: zwei 555, astabiler IC1 triggert monostabilen IC2",fixed:"fest",fixedPart:"NE555 · festes Bauteil",icNote:"Die beiden 555 bleiben, wie sie sind: Sie sind das Herz der Schaltung. Alles andere lässt sich ändern.",valOf:"Wert von",value:"Wert",fineOf:"Feineinstellung von",down:"◀ Runter",up:"Hoch ▶",prevStd:"Vorheriger Normwert",nextStd:"Nächster Normwert",set:"Setzen",orig:"Original",shaft:"Achsstellung",posOf:"Stellung von",curve:"Kennlinie",tapA:"A · logarithmisch",tapB:"B · linear",bad:"Ungültiger Wert",range:"Bereich von",to:"bis",clk:"Takt",hilo:"High / Low",pul:"Puls",hp:"Bass-Grenze",lvl:"Pegel",vhigh:"High-Ausgang",ipk:"Spitzenstrom",bands:"Ringe",body:"Gehäuse",logA:"logarithmisch (A)",linB:"linear (B)",elec:"Elko",cer:"Keramik · Code",usbc:"USB-C- oder Micro-USB-Buchse · 5 V",batsrc:"Batterie / Netzteil",spkc:"Lautsprecher",cols:"schwarz,braun,rot,orange,gelb,grün,blau,violett,grau,weiß,gold,silber",notes:"C,Cis,D,Dis,E,F,Fis,G,Gis,A,B,H",vol:"Lautstärke",padAria:"Pad: horizontal bewegt VR1, vertikal VR2. Jede Farbe ist eine andere Teilung",stairAria:"Diagramm der Ausgangsfrequenz über der Stellung von VR1. Ziehen bewegt VR1",play:"Spielen",stair:"Treppe",gateFree:"Gate: frei",gateTouch:"Gate: bei Berührung",howTo:"So spielst du",playNote:"Auf dem Pad: horizontal = VR1 (Takt), vertikal = VR2 (Puls). Jede Farbe ist eine Teilung ÷n; die Helligkeit zeigt die Tonhöhe. Mit Gate „bei Berührung“ klingt es nur, solange der Finger aufliegt.",stairNote:"Gestrichelte Linie: der Takt von IC1. Dicke Linie: das, was klingt. IC2 nimmt einen Trigger erst an, wenn sein Puls vorbei ist, daher ist der Ausgang der Takt geteilt durch eine ganze Zahl (÷1, ÷2, ÷3…). Jeder Farbsprung ist ein Teilungswechsel: Das ist der „gestufte“ Klang der Atari Punk. Zieh über das Diagramm, um VR1 zu bewegen.",readings:"Messwerte",s2:"Die Platine",s2m:"Echte Bauteile · Ringe und Codes aktuell",boardLbl:"Platinenansicht · illustrativ",boardAria:"Illustrative Platine mit den Bauteilen und ihren aktuellen Werten",swipeBoard:"← Platine wischen, um alles zu sehen →",boardNote:"Die Farbringe der Widerstände, der Code der Keramikkondensatoren (103 = 10 nF) und die Stellung der Potis folgen deinen Werten. Ein Kondensator ab 1 µF wird als Elko gezeichnet: auf die Polung achten. Rot/Magenta: +V · grau: Masse · cyan: Takt · gelb: Ausgang.",s3:"Stückliste",pieces:"Teile",th:"Ref,Bauteil,Wert,Code,Status",timer:"Timer 555",changedS:"geändert",original:"original",export:"Liste exportieren",exportHint:"PNG mit Liste, Werten und Treppe",name:"Name",comboName:"Name der Kombination",myCombos:"Meine Kombinationen",save:"Speichern",none:"noch keine gespeichert",del:"Löschen",delQ:"löschen?",deleted:"Gelöscht",load:"Laden",nostore:"Dieser Browser kann nicht speichern",needName:"Gib einen Namen ein",updated:"Aktualisiert",saved:"Gespeichert",loaded:"Geladen",unnamed:"Ohne Namen",batt:"Batterie",axes:"Achsen beim Export",extras:"dazu: Ausgangsbuchse oder Klemme, Kabel, Platine",cap100:"100 µF zwischen +V und Masse",credit2:"Originalentwurf von Forrest M. Mims III (Stepped Tone Generator) · Werte aus der Simulation der App",expFail:"Export fehlgeschlagen",exported:"Exportiert",foot:"Atari Punk Console · Originalentwurf von Forrest M. Mims III (Stepped Tone Generator) · Näherungssimulation, ohne echte Last des 555",lang:"Sprache",locale:"de-DE",ic1n:"Astabil · der Takt",ic2n:"Monostabil · der Puls",pg:"Masse",p1t:"mit 6 verbunden: startet den Zyklus neu",p1o:"triggert IC2",prst:"an +V",pcv:"frei",p1th:"mit 2 verbunden, misst C1",p1d:"entlädt C1 über VR1",p2t:"empfängt den Takt von IC1",p2o:"zum Lautsprecher über C3",p2th:"mit 7 verbunden, misst C2",p2d:"entlädt C2",
PM:{VCC:["Batterie","Versorgt beide 555. Der NE555 arbeitet zwischen 4,5 und 16 V; sein High-Ausgang liegt etwa 1,7 V unter der Versorgung.","Mehr Spannung: mehr Lautstärke. Die Frequenz bleibt gleich, weil der 555 gegen 1/3 und 2/3 derselben Spannung vergleicht."],
R1:["Takt-Anschlag","Geht von +V zu Pin 7 von IC1. Mit VR1 auf Minimum bremst nur er das Laden von C1: Er legt die höchste Taktfrequenz fest und schützt den Entladepin.","Größer: Mit VR1 auf Minimum wird der Takt weniger hoch."],
VR1:["Takt-Poti","Regelwiderstand zwischen Pin 7 und den Pins 6 und 2 von IC1. Er bestimmt die Frequenz des astabilen Kippers: die Pulsfolge, die IC2 triggert.","Höherer Wert: Der Regelweg reicht zu tieferen Frequenzen. Die Stellung spielst du auf dem Pad."],
C1:["Takt-Timing","Lädt über R1+VR1 und entlädt über VR1, zwischen 1/3 und 2/3 von Vcc. f = 1,44 / ((R1 + 2·VR1)·C1).","Größer: Der ganze Takt wird langsamer."],
R2:["Puls-Anschlag","In Reihe mit VR2, zwischen +V und den Pins 6 und 7 von IC2. Legt den kürzesten Puls des Monoflops fest.","Größer: Der kürzeste Puls wird länger."],
VR2:["Puls-Poti","Bestimmt, wie lange der Puls von IC2 dauert. Solange der Puls high ist, ignoriert IC2 die Takt-Trigger: Deshalb springt der Ausgang in Stufen (÷1, ÷2, ÷3…).","Höherer Wert: längere Pulse und mehr mögliche Teilungen."],
C2:["Puls-Timing","Kondensator des Monoflops. Pulsdauer: T = 1,1·(R2+VR2)·C2.","Größer: längerer Puls, tiefere Töne und mehr Stufen."],
C3:["Ausgangskopplung","Zwischen Pin 3 von IC2 und dem Lautsprecher. Sperrt Gleichspannung; mit R3 und dem Lautsprecher bildet er einen Hochpass.","Kleiner: Die Bässe verschwinden, der Klang wird dünner."],
R3:["Ausgangswiderstand","Begrenzt den Strom aus Pin 3 von IC2 und senkt die Lautstärke am Lautsprecher.","Größer: weniger Lautstärke und weniger Strom."],
SPK:["Lautsprecher","Die Last. Seine Impedanz bestimmt zusammen mit R3 die Lautstärke und mit C3, wo die Bässe abgeschnitten werden.","Mehr Ohm: mehr Spannung am Lautsprecher und eine tiefere Bass-Grenze."]},
USB:["USB-Versorgung 5 V","USB-Eingang mit 5 V: Ladegerät, Computer oder Powerbank. Der NE555 braucht mindestens 4,5 V, bei 5 V läuft er also, aber knapp. Der High-Ausgang liegt bei etwa 3,3 V. Achtung: Manche Powerbanks schalten sich bei so geringem Verbrauch selbst ab.","Weniger Spannung, weniger Lautstärke: Bei USB besser R3 = 100 Ω. Setz einen 100-µF-Elko zwischen +V und Masse, nah an die 555, um das USB-Rauschen zu filtern."]},

zh:{snd:"声音",sndOn:"发声中",noaudio:"浏览器无法打开音频",sub:"阶梯音控制台",astmono:"无稳态 → 单稳态",astU:"无稳态",monoU:"单稳态",bat9:"电池 9 V",r3to:"R3 改为",scopeAria:"示波器：C2 电压与扬声器信号",clockIC:"时钟 · IC1",pulseIC:"脉冲 · IC2",div:"分频",out:"输出",s1:"电路",s1m:"原理图 · 点击元件即可更改",presets:"预设",presetT:"预设",p0:"经典",p1:"低沉",p2:"啁啾",p3:"多阶梯",p4:"Lo-fi 5 V",restore:"复位",origVals:"原始数值",supply:"供电",bat9b:"9 V · 电池",min45:"NE555 至少需要 4.5 V",swipeSch:"← 左右滑动查看完整原理图 →",note1:"所有电阻、电位器、电容、电池和扬声器都可以更换。按电路板上的写法输入数值：4k7、10n、100u、2M2。两颗 NE555 保持不变。",schAria:"Atari Punk 原理图：两颗 555，无稳态 IC1 触发单稳态 IC2",fixed:"固定",fixedPart:"NE555 · 固定元件",icNote:"两颗 555 保持原样：它们是电路的核心。其他一切都可以更改。",valOf:"数值",value:"数值",fineOf:"微调",down:"◀ 降低",up:"升高 ▶",prevStd:"上一个标准值",nextStd:"下一个标准值",set:"设定",orig:"原始",shaft:"旋钮位置",posOf:"位置",curve:"曲线",tapA:"A · 对数",tapB:"B · 线性",bad:"数值无效",range:"范围",to:"至",clk:"时钟",hilo:"高 / 低",pul:"脉冲",hp:"低频截止",lvl:"电平",vhigh:"高电平输出",ipk:"峰值电流",bands:"色环",body:"外壳",logA:"对数（A）",linB:"线性（B）",elec:"电解电容",cer:"陶瓷电容 · 代码",usbc:"USB-C 或 Micro-USB 接口 · 5 V",batsrc:"电池 / 电源",spkc:"扬声器",cols:"黑,棕,红,橙,黄,绿,蓝,紫,灰,白,金,银",notes:"C,C#,D,D#,E,F,F#,G,G#,A,A#,B",vol:"音量",padAria:"触控板：横向调节 VR1，纵向调节 VR2。每种颜色代表一种分频",stairAria:"VR1 位置与输出频率的关系图。拖动以调节 VR1",play:"演奏",stair:"阶梯",gateFree:"Gate：自由",gateTouch:"Gate：触摸时",howTo:"演奏方法",playNote:"在触控板上，横向 = VR1（时钟），纵向 = VR2（脉冲）。每种颜色是一种 ÷n 分频；亮度表示音高。Gate 设为“触摸时”时，只有手指按住才会发声。",stairNote:"虚线：IC1 的时钟。粗线：实际听到的声音。IC2 只有在脉冲结束后才接受触发，所以输出是时钟除以一个整数（÷1、÷2、÷3…）。每次颜色跳变就是分频改变：这就是 Atari Punk 的“阶梯”声。在图上拖动可调节 VR1。",readings:"读数",s2:"电路板",s2m:"真实元件 · 色环与代码实时更新",boardLbl:"电路板视图 · 示意",boardAria:"示意电路板，显示元件及其当前数值",swipeBoard:"← 左右滑动查看完整电路板 →",boardNote:"电阻色环、陶瓷电容代码（103 = 10 nF）和电位器位置都会随你的数值变化。1 µF 及以上的电容画成电解电容：注意极性。红/洋红：+V · 灰：地 · 青：时钟 · 黄：输出。",s3:"物料清单",pieces:"个元件",th:"编号,元件,数值,代码,状态",timer:"555 定时器",changedS:"已更改",original:"原始",export:"导出清单",exportHint:"包含清单、数值和阶梯图的 PNG",name:"名称",comboName:"组合名称",myCombos:"我的组合",save:"保存",none:"还没有保存任何组合",del:"删除",delQ:"删除？",deleted:"已删除",load:"载入",nostore:"此浏览器无法保存",needName:"请输入名称",updated:"已更新",saved:"已保存",loaded:"已载入",unnamed:"未命名",batt:"电池",axes:"导出时旋钮",extras:"另需：输出插孔或接线端子、导线、电路板",cap100:"+V 与地之间接 100 µF",credit2:"原始设计：Forrest M. Mims III（Stepped Tone Generator）· 数值由本应用模拟计算",expFail:"导出失败",exported:"已导出",foot:"Atari Punk Console · 原始设计：Forrest M. Mims III（Stepped Tone Generator）· 近似模拟，未计入 555 的真实负载",lang:"语言",locale:"zh-CN",ic1n:"无稳态 · 时钟",ic2n:"单稳态 · 脉冲",pg:"地",p1t:"接 6：重新触发周期",p1o:"触发 IC2",prst:"接 +V",pcv:"悬空",p1th:"接 2，检测 C1",p1d:"经 VR1 给 C1 放电",p2t:"接收 IC1 的时钟",p2o:"经 C3 接扬声器",p2th:"接 7，检测 C2",p2d:"给 C2 放电",
PM:{VCC:["电池","为两颗 555 供电。NE555 的工作电压为 4.5–16 V；其高电平输出比电源低约 1.7 V。","电压越高，音量越大。频率不变，因为 555 比较的是同一电压的 1/3 和 2/3。"],
R1:["时钟限位","从 +V 接到 IC1 的 7 脚。VR1 调到最小时，只有它限制 C1 的充电：它决定时钟的最高音，并保护放电脚。","更大：VR1 最小时，时钟达不到那么高。"],
VR1:["时钟电位器","IC1 的 7 脚与 6、2 脚之间的可变电阻。决定无稳态的频率，即触发 IC2 的脉冲串。","阻值越大：旋转范围可到更低的频率。位置在触控板上演奏。"],
C1:["时钟定时","经 R1+VR1 充电、经 VR1 放电，在 Vcc 的 1/3 与 2/3 之间。f = 1.44 / ((R1 + 2·VR1)·C1)。","更大：整个时钟变慢。"],
R2:["脉冲限位","与 VR2 串联，接在 +V 与 IC2 的 6、7 脚之间。决定单稳态的最短脉冲。","更大：最短脉冲变长。"],
VR2:["脉冲电位器","决定 IC2 的脉冲持续多久。脉冲为高时，IC2 会忽略时钟触发：所以输出是一级一级跳变的（÷1、÷2、÷3…）。","阻值越大：脉冲更长，可能的分频更多。"],
C2:["脉冲定时","单稳态的电容。脉冲时长：T = 1.1·(R2+VR2)·C2。","更大：脉冲更长、音更低、阶梯更多。"],
C3:["输出耦合","接在 IC2 的 3 脚与扬声器之间。隔断直流；与 R3 和扬声器组成高通滤波器。","更小：低频消失，声音变细。"],
R3:["输出电阻","限制 IC2 的 3 脚输出电流，并降低扬声器上的音量。","更大：音量更小，电流更小。"],
SPK:["扬声器","负载。其阻抗加上 R3 决定音量，并与 C3 一起决定低频截止点。","欧姆越高：扬声器上的电压更高，低频截止更低。"]},
USB:["USB 5 V 电源","5 V USB 输入：充电器、电脑或充电宝。NE555 至少需要 4.5 V，所以 5 V 能工作，但接近下限。高电平输出约 3.3 V。注意：有些充电宝在如此低的电流下会自动关机。","电压更低，音量更小：用 USB 时建议 R3 = 100 Ω。在 +V 与地之间、靠近 555 处加一个 100 µF 电解电容，以滤除 USB 噪声。"]},

PM:{VCC:["電池","2 個の 555 に電源を供給します。NE555 は 4.5〜16 V で動作し、ハイ出力は電源より約 1.7 V 低くなります。","電圧を上げると音量が上がります。周波数は変わりません。555 は同じ電圧の 1/3 と 2/3 を基準に比較するからです。"],
R1:["クロック上限","+V から IC1 の 7 番ピンへ。VR1 が最小のとき C1 の充電を抑えるのはこれだけで、クロックの最高音を決め、放電ピンを保護します。","大きくすると：VR1 最小時のクロックがそれほど高くならない。"],
VR1:["クロック・ポット","IC1 の 7 番ピンと 6・2 番ピンの間の可変抵抗。非安定発振の周波数、つまり IC2 をトリガーするパルス列を決めます。","値を大きくすると：回したときにより低い周波数まで届く。位置はパッドで演奏します。"],
C1:["クロックのタイミング","R1+VR1 で充電し VR1 で放電、Vcc の 1/3〜2/3 の間で動きます。f = 1.44 / ((R1 + 2·VR1)·C1)。","大きくすると：クロック全体が遅くなる。"],
R2:["パルス上限","VR2 と直列に、+V と IC2 の 6・7 番ピンの間へ。単安定の最短パルスを決めます。","大きくすると：最短パルスが長くなる。"],
VR2:["パルス・ポット","IC2 のパルスの長さを決めます。パルスがハイの間、IC2 はクロックのトリガーを無視します：だから出力は段階的に跳びます（÷1、÷2、÷3…）。","値を大きくすると：パルスが長くなり、分周の段数が増える。"],
C2:["パルスのタイミング","単安定のコンデンサ。パルス長：T = 1.1·(R2+VR2)·C2。","大きくすると：パルスが長く、音が低く、段数が増える。"],
C3:["出力カップリング","IC2 の 3 番ピンとスピーカーの間。直流をカットし、R3 とスピーカーでハイパスフィルターを作ります。","小さくすると：低音が抜けて音が細くなる。"],
R3:["出力抵抗","IC2 の 3 番ピンが流す電流を制限し、スピーカーの音量を下げます。","大きくすると：音量も電流も小さくなる。"],
SPK:["スピーカー","負荷です。インピーダンスと R3 の合計で音量が決まり、C3 と合わせて低域のカット位置が決まります。","Ω を上げると：スピーカーにかかる電圧が上がり、低域カットが下がる。"]},
USB:["USB 5 V 電源","5 V の USB 入力：充電器、パソコン、モバイルバッテリー。NE555 は最低 4.5 V が必要なので 5 V で動きますが、ぎりぎりです。ハイ出力は約 3.3 V。注意：消費電流が少なすぎると自動で切れるモバイルバッテリーもあります。","電圧が低いと音量も下がります：USB では R3 = 100 Ω がおすすめ。555 の近くで +V と GND の間に 100 µF の電解コンデンサを入れ、USB のノイズを除去しましょう。"]},

C2:["पल्स टाइमिंग","एकस्थिर का कैपेसिटर। पल्स की अवधि: T = 1.1·(R2+VR2)·C2।","बड़ा: लंबी पल्स, नीचे सुर और ज़्यादा सीढ़ियाँ।"],

R3:["आउटपुट रेज़िस्टर","IC2 के पिन 3 से निकलने वाले करंट को सीमित करता है और स्पीकर पर आवाज़ कम करता है।","बड़ा: कम आवाज़ और कम करंट।"],
SPK:["स्पीकर","लोड। इसका इम्पीडेंस, R3 के साथ मिलकर, आवाज़ तय करता है और C3 के साथ यह कि बेस कहाँ कटेगा।","ज़्यादा ओम: स्पीकर पर ज़्यादा वोल्टेज और नीचा बेस कटऑफ़।"]},
USB:["USB 5 V सप्लाई","5 V USB इनपुट: चार्जर, कंप्यूटर या पावर बैंक। NE555 को कम से कम 4.5 V चाहिए, इसलिए 5 V पर चलता है, पर सीमा के करीब। हाई आउटपुट लगभग 3.3 V रहता है। ध्यान दें: कुछ पावर बैंक इतनी कम खपत पर अपने-आप बंद हो जाते हैं।","कम वोल्टेज, कम आवाज़: USB पर R3 = 100 Ω बेहतर है। USB का शोर छानने के लिए 555 के पास +V और ग्राउंड के बीच 100 µF का इलेक्ट्रोलिटिक लगाएँ।"]}

const taper=(id,p)=>TAP[id]==='A'?(Math.pow(10,2*p)-1)/99:p;
function calc(v=V,p1=POS.VR1,p2=POS.VR2){
  const RA=v.R1,RB=Math.max(50,v.VR1*taper('VR1',p1));
  const Th=.693*(RA+RB)*v.C1,Tl=.693*RB*v.C1,Ta=Th+Tl;
  const Rm=v.R2+Math.max(50,v.VR2*taper('VR2',p2)),Tm=1.1*Rm*v.C2;

  return {RA,RB,Rm,Th,Tl,Ta,fa:1/Ta,Tm,n,To,fo:1/To,rco,hp:1/(2*Math.PI*rco),vh:Math.max(0,v.VCC-1.7),
    gain:(v.SPK/(v.R3+v.SPK))*Math.max(0,v.VCC-1.7)/((8/228)*7.3)};
}
/* núcleo de audio: eventos exactos de los dos 555 por muestra (se usa en el AudioWorklet y como respaldo) */
function makeCore(){return {p:{Th:1e-4,Tl:1e-4,Tm:1e-3,vh:7.3,rc:2.28e-3,g:0,on:0},ph:0,mono:0,str:false,xp:0,y:0,env:0,
  render(o,sr){const p=this.p,dt=1/sr,Th=Math.max(2e-7,p.Th),Tl=Math.max(2e-7,p.Tl),Ta=Th+Tl,Tm=Math.max(2e-7,p.Tm),a=p.rc/(p.rc+dt);
    if(this.ph>=Ta)this.ph=0;if(this.mono>Tm)this.mono=Tm;
    for(let i=0;i<o.length;i++){let r=dt,hi=0,it=0;
      while(r>1e-13&&it<400){it++;const low=this.ph>=Th,toA=low?Ta-this.ph:Th-this.ph,toM=this.mono>0?this.mono:1e9;
        const st=Math.max(0,Math.min(r,toA,toM));
        if(this.mono>0||(this.str&&low))hi+=st;
        this.ph+=st;r-=st;if(this.mono>0){this.mono-=st;if(this.mono<1e-13)this.mono=0;}
        if(!low&&this.ph>=Th-1e-13){this.ph=Th;if(this.mono<=0){this.mono=Tm;this.str=true;}}
        else if(low&&this.ph>=Ta-1e-13){this.ph=0;this.str=false;}}
      const x=(hi/dt)*p.vh;this.y=a*(this.y+x-this.xp);this.xp=x;
      this.env+=((p.on?1:0)-this.env)*.004;o[i]=Math.tanh(this.y*p.g)*this.env;}}};}
/* trazas para el osciloscopio */
function traces(win,N){
  const c=calc(),{Th,Tl,Ta,Tm}=c,Vc=V.VCC,vh=c.vh,r1=(c.RA+c.RB)*V.C1,r1d=c.RB*V.C1,rm=c.Rm*V.C2,rco=c.rco;
  let ph=0,mono=0,str=false,y=0,xp=0;const dtS=win/N,a=rco/(rco+dtS);
  function adv(d){let r=d,hi=0,it=0;while(r>1e-15&&it<6000){it++;const low=ph>=Th,toA=low?Ta-ph:Th-ph,toM=mono>0?mono:1e9,st=Math.max(0,Math.min(r,toA,toM));
    if(mono>0||(str&&low))hi+=st;ph+=st;r-=st;if(mono>0){mono-=st;if(mono<1e-15)mono=0;}
    if(!low&&ph>=Th-1e-15){ph=Th;if(mono<=0){mono=Tm;str=true;}}else if(low&&ph>=Ta-1e-15){ph=0;str=false;}}return hi/d;}
  const pre=Math.min(20000,Math.ceil(Math.max(4*rco,2*c.To)/dtS));
  for(let i=0;i<pre;i++){const x=adv(dtS)*vh;y=a*(y+x-xp);xp=x;}
  // alinear al inicio de un pulso de salida
  let guard=0;while(!(mono>0&&mono>Tm-dtS)&&guard++<40000){const x=adv(dtS/4)*vh;y=a*(y+x-xp);xp=x;}
  const T={c1:new Float32Array(N),o1:new Float32Array(N),c2:new Float32Array(N),sp:new Float32Array(N)};
  for(let i=0;i<N;i++){const lowB=ph>=Th;const f=adv(dtS),x=f*vh;y=a*(y+x-xp);xp=x;
    const low=ph>=Th;T.c1[i]=!low?Vc-(Vc-Vc/3)*Math.exp(-ph/r1):(2*Vc/3)*Math.exp(-(ph-Th)/r1d);
    T.o1[i]=(low&&lowB)?0:(!low&&!lowB)?vh:vh*.5;
    T.c2[i]=mono>0?Vc*(1-Math.exp(-(Tm-mono)/rm)):(str&&low?2*Vc/3:0);
    T.sp[i]=y;}
  T.o2=null;return T;
}

  const win=clamp(3*c.To,1e-4,.3),N=Math.round(clamp(w/1.5,60,900));const T=traces(win,N);
  g.fillStyle='#0B0B0C';g.fillRect(0,0,w,hh);
  g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=1;for(let i=1;i<10;i++){g.beginPath();g.moveTo(w*i/10,0);g.lineTo(w*i/10,hh);g.stroke();}

    if(lo==null){let m=1e-6;for(const v of arr)m=Math.max(m,Math.abs(v));lo=-m*1.05;hi=m*1.05;}
    if(k){g.strokeStyle='rgba(255,255,255,.12)';g.beginPath();g.moveTo(0,k*lh);g.lineTo(w,k*lh);g.stroke();}
    const draw=(a,b,alpha,lw)=>{g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=lw;g.beginPath();for(let i=a;i<b;i++){const x=i/(N-1)*w,y=y1-(y1-y0)*(arr[i]-lo)/(hi-lo);i===a?g.moveTo(x,y):g.lineTo(x,y);}g.stroke();g.globalAlpha=1;};

function saveCombo(name){name=String(name||'').trim().slice(0,28);if(!name){toast(tr('needName'));$('#cmbname')?.focus();return;}
  const rec={n:name,V:{...V},P:{...POS},T:{...TAP},d:Date.now()};const i=COMBOS.findIndex(c=>c.n.toLowerCase()===name.toLowerCase());
  if(i>=0)COMBOS[i]=rec;else{COMBOS.unshift(rec);if(COMBOS.length>30)COMBOS.length=30;}
  storeCombos();curName=name;renderCombos();save();toast((i>=0?tr('updated'):tr('saved'))+': '+name);}
function loadCombo(i){const c=COMBOS[i];if(!c)return;V={...DEF,...c.V};for(const id in PM)V[id]=clamp(V[id]>0?V[id]:DEF[id],PM[id].min,PM[id].max);

function stairOn(g,x0,y0,w,hh,C){const N=300,P=[];let lo=1e9,hi=0;for(let i=0;i<=N;i++){const c=calc(V,i/N,POS.VR2);P.push(c);lo=Math.min(lo,c.fo);hi=Math.max(hi,c.fo);}

      if(X((i-1)/N)-X(i0/N)>22){g.fillStyle=n%2?C.MAG:C.INK;g.font='700 12px '+C.BC;g.fillText('÷'+n,X((i0+i-1)/2/N),Y(P[Math.floor((i0+i-1)/2)].fo)-12);}i0=i;}}
  g.restore();const c=calc(),x=X(POS.VR1),y=Y(c.fo);g.strokeStyle=C.INK;g.lineWidth=1.2;g.beginPath();g.moveTo(x,T);g.lineTo(x,B);g.stroke();
  g.fillStyle=C.YEL;g.lineWidth=2;g.beginPath();g.rect(x-7,y-7,14,14);g.fill();g.stroke();}
